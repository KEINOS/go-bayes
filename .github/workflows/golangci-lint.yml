# Details of this action see: https://github.com/golangci/golangci-lint-action
name: golangci-lint
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          args: --config ./.golangci.yml ./... ./_examples/http_status ./_examples/iris ./_examples/melody ./_examples/mushroom ./_examples/wine
