# DO NOT EDIT THIS FILE.
# Only the maintainer approved changes are allowed.
version: "2"
run:
  tests: true
  allow-parallel-runners: true
linters:
  default: all
  disable:
    # Deprecated linters
    - wsl
    - wsl_v5
    - gomodguard
    - exhaustruct
    - exhaustruct_v5
    # Disabled by project policy
    - depguard
    - testpackage
  settings:
    paralleltest:
      ignore-missing: false
    varnamelen:
      ignore-names:
        - ok
        - t
        - tt
